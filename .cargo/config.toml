# Windows builds link with llvm-mingw (https://github.com/mstorsjo/llvm-mingw),
# whose target-prefixed clang drivers must be on PATH. They provide the
# import libraries for x64 and ARM64 that the GUI stack links against.
[target.x86_64-pc-windows-gnullvm]
linker = "x86_64-w64-mingw32-clang"

[target.aarch64-pc-windows-gnullvm]
linker = "aarch64-w64-mingw32-clang"
